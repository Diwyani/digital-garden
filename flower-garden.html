<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background: #161618; }
canvas { display:block; width:100%; height: 480px;px; image-rendering:pixelated; image-rendering:crisp-edges; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const PX = 4;
let cw, ch, t = 0;

function resize() {
  canvas.width = Math.floor(canvas.offsetWidth / PX);
  canvas.height = Math.floor(canvas.offsetHeight / PX);
  cw = canvas.width;
  ch = canvas.height;
}

function px(x, y, col, alpha) {
  if (x < 0 || x >= cw || y < 0 || y >= ch) return;
  ctx.fillStyle = col;
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillRect(x, y, 1, 1);
}

// grass ground strip
function drawGround(ground) {
  // base soil strip
  for (let x = 0; x < cw; x++) {
    px(x, ground,   '#1a3d10', 1);
    px(x, ground+1, '#162e0d', 1);
    px(x, ground+2, '#12260b', 1);
    px(x, ground+3, '#0f1e08', 1);
  }
  // grass blades — irregular, some bent
  for (let x = 0; x < cw; x += 1) {
    const h = ((x * 7 + 3) % 5) + 1;
    const bend = Math.round(Math.sin(t * 0.6 + x * 0.4) * 0.8);
    const col = (x % 3 === 0) ? '#4ab830' : (x % 3 === 1) ? '#3a9a28' : '#2d7a20';
    for (let i = 0; i < h; i++) {
      const bx = x + (i > 1 ? bend : 0);
      px(bx, ground - 1 - i, col, 0.85 + (i/h)*0.15);
    }
  }
}

function stem(bx, by, height, time, swayAmp, swayFreq, swayOffset) {
  for (let i = 0; i < height; i++) {
    const sway = Math.round(Math.sin(time * swayFreq + swayOffset + i * 0.22) * swayAmp * (i / height));
    px(bx + sway,     by - i, '#2d7a20');
    px(bx + sway + 1, by - i, '#3a9a28');
  }
}

function stemTip(bx, by, height, time, swayAmp, swayFreq, swayOffset) {
  // returns tip x after sway
  const sway = Math.round(Math.sin(time * swayFreq + swayOffset + height * 0.22) * swayAmp);
  return bx + sway;
}

function leaf(bx, by, dir, size, time, swayFreq, swayOffset) {
  const sway = Math.sin(time * swayFreq + swayOffset) * 0.6;
  const lx = Math.round(bx + dir * 2 + sway);
  const pts = size === 'sm'
    ? [[0,0],[1*dir,0],[1*dir,-1],[0,-1]]
    : [[0,0],[1*dir,0],[2*dir,-1],[1*dir,-1],[0,-1],[-1*dir+dir,0]];
  pts.forEach(([dx,dy]) => px(lx+dx, by+dy, '#4ab830', 0.85));
  px(lx, by, '#3a9a28', 0.9);
}

function bgLeaf(bx, by, time, swayOffset) {
  const sway = Math.round(Math.sin(time * 0.5 + swayOffset) * 0.8);
  [[0,0],[1,0],[0,-1],[1,-1]].forEach(([dx,dy]) => px(bx+dx+sway, by+dy, '#1e5214', 0.7));
}

function drawBud(cx, cy, time, so) {
  [[0,-1]].forEach(([dx,dy]) => px(cx+dx, cy+dy, '#9ab0bf', 0.9));
  [[-1,0],[1,0]].forEach(([dx,dy]) => px(cx+dx, cy+dy, '#7b97aa', 0.7));
  [[-1,1],[0,1],[1,1]].forEach(([dx,dy]) => px(cx+dx, cy+dy, '#3a9a28'));
}

function drawSmallBloom(cx, cy, time, so) {
  const n = 6, len = 5;
  for (let p = 0; p < n; p++) {
    const a = (p/n)*Math.PI*2 + Math.sin(time*0.8+so+p*0.4)*0.06;
    const cos=Math.cos(a), sin=Math.sin(a);
    for (let y=1;y<=len;y++) {
      const hw = Math.round(Math.sin((y/len)*Math.PI)*2);
      for (let x=-hw;x<=hw;x++) {
        const ppx=Math.round(cx+(x*cos-(-y)*sin)+cos*2);
        const ppy=Math.round(cy+(x*sin+(-y)*cos)+sin*2);
        const edge=Math.abs(x)===hw||y===1||y===len;
        if(edge) px(ppx,ppy,'#7b97aa',0.9);
        else if(((x*7+y*11+p*5)%9)<4 && Math.sin(time*1.6+p*0.7+x+y)>0.3) px(ppx,ppy,'#5a7a8a',0.55);
      }
    }
  }
  px(cx,cy,'#f5c842',0.9);
  [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dx,dy])=>px(cx+dx,cy+dy,'#e09020',0.7));
}

function drawMiniBloom(cx, cy, time, so) {
  // tiny bg flower — 6 petals, very short
  const n=6, len=3;
  for(let p=0;p<n;p++){
    const a=(p/n)*Math.PI*2+Math.sin(time*0.7+so+p*0.5)*0.05;
    const cos=Math.cos(a), sin=Math.sin(a);
    for(let y=1;y<=len;y++){
      const hw=Math.round(Math.sin((y/len)*Math.PI)*1.5);
      for(let x=-hw;x<=hw;x++){
        const ppx=Math.round(cx+(x*cos-(-y)*sin)+cos*2);
        const ppy=Math.round(cy+(x*sin+(-y)*cos)+sin*2);
        px(ppx,ppy,'#5a7a8a',0.55);
      }
    }
  }
  px(cx,cy,'#e09020',0.8);
}

function drawMediumBloom(cx, cy, time, so) {
  const n=9, len=9;
  for(let p=0;p<n;p++){
    const a=(p/n)*Math.PI*2+Math.sin(time*0.85+so+p*0.5)*0.07;
    const cos=Math.cos(a), sin=Math.sin(a);
    for(let y=1;y<=len;y++){
      const hw=Math.round(Math.sin((y/len)*Math.PI)*3);
      for(let x=-hw;x<=hw;x++){
        const ppx=Math.round(cx+(x*cos-(-y)*sin)+cos*3);
        const ppy=Math.round(cy+(x*sin+(-y)*cos)+sin*3);
        const edge=Math.abs(x)===hw||y===1||y===len;
        if(edge) px(ppx,ppy,'#7b97aa',0.95);
        else if(((x*7+y*13+p*5)%11)<5 && Math.sin(time*1.4+p*0.8+x*0.4+y*0.6)>0.2) px(ppx,ppy,'#5a7a8a',0.6);
      }
    }
  }
  for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){
    if(dx*dx+dy*dy>4) continue;
    px(cx+dx,cy+dy,dx*dx+dy*dy<2?'#f5c842':'#e09020',Math.sin(time*2.5)*0.12+0.85);
  }
}

function drawFullBloom(cx, cy, time, so) {
  const n=12, len=16;
  for(let p=0;p<n;p++){
    const a=(p/n)*Math.PI*2+Math.sin(time*0.9+so+p*0.6)*0.07;
    const cos=Math.cos(a), sin=Math.sin(a);
    for(let y=1;y<=len;y++){
      const hw=Math.round(Math.sin((y/len)*Math.PI)*5);
      for(let x=-hw;x<=hw;x++){
        const ppx=Math.round(cx+(x*cos-(-y)*sin)+cos*4);
        const ppy=Math.round(cy+(x*sin+(-y)*cos)+sin*4);
        const edge=Math.abs(x)===hw||y===1||y===len;
        if(edge) px(ppx,ppy,'#7b97aa',0.98);
        else if(((x*7+y*13+p*5)%11)<5 && Math.sin(time*1.4+p*0.8+x*0.4+y*0.6)>0.2) px(ppx,ppy,'#5a7a8a',0.6);
      }
    }
  }
  for(let dy=-3;dy<=3;dy++) for(let dx=-3;dx<=3;dx++){
    if(dx*dx+dy*dy>9) continue;
    px(cx+dx,cy+dy,dx*dx+dy*dy<4?'#f5c842':'#e09020',Math.sin(time*3)*0.15+0.85);
  }
}

function frame() {
  t += 0.018;
  ctx.clearRect(0, 0, cw, ch);
  ctx.fillStyle = '#161618';
  ctx.globalAlpha = 1;
  ctx.fillRect(0, 0, cw, ch);

  const ground = ch - 6;

  // ── BACKGROUND LAYER ── scattered small leaves and tiny flowers
  const bgPlants = [
    { x: 0.08, stemH: 10, so: 0.3 },
    { x: 0.14, stemH: 8,  so: 1.1 },
    { x: 0.24, stemH: 12, so: 2.0 },
    { x: 0.38, stemH: 9,  so: 0.8 },
    { x: 0.45, stemH: 11, so: 3.1 },
    { x: 0.56, stemH: 8,  so: 1.7 },
    { x: 0.62, stemH: 13, so: 4.2 },
    { x: 0.74, stemH: 9,  so: 2.6 },
    { x: 0.79, stemH: 10, so: 0.5 },
    { x: 0.88, stemH: 11, so: 3.8 },
    { x: 0.94, stemH: 7,  so: 1.4 },
  ];

  bgPlants.forEach(({ x, stemH, so }) => {
    const bx = Math.floor(cw * x);
    // faint bg stem
    for (let i = 0; i < stemH; i++) {
      const sway = Math.round(Math.sin(t * 0.5 + so + i * 0.2) * 0.6 * (i/stemH));
      px(bx + sway, ground - i, '#1e5214', 0.6);
    }
    // bg leaf clusters
    bgLeaf(bx - 2, ground - Math.floor(stemH * 0.5), t, so);
    bgLeaf(bx + 1, ground - Math.floor(stemH * 0.7), t, so + 1);
    // tiny bg flower on some
    if (so % 2 < 1.2) {
      const tx = bx + Math.round(Math.sin(t*0.5+so)*1);
      drawMiniBloom(tx, ground - stemH - 1, t, so);
    }
  });

  // ── FOREGROUND PLANTS ── asymmetric, varied heights, pushed apart

  // Plant A — bud, far left, leans left
  const ax = Math.floor(cw * 0.07);
  stem(ax, ground, 16, t, 1.1, 0.7, 0.0);
  leaf(ax, ground-6,  -1, 'md', t, 0.7, 0.0);
  leaf(ax, ground-12,  1, 'sm', t, 0.7, 0.6);
  drawBud(ax + Math.round(Math.sin(t*0.7)*1), ground-17, t, 0.0);

  // Plant B — small bloom, left
  const bx2 = Math.floor(cw * 0.18);
  stem(bx2, ground, 22, t, 1.2, 0.72, 1.3);
  leaf(bx2, ground-8,   1, 'md', t, 0.72, 1.3);
  leaf(bx2, ground-15, -1, 'md', t, 0.72, 2.1);
  leaf(bx2, ground-19,  1, 'sm', t, 0.72, 2.8);
  const bs2 = Math.round(Math.sin(t*0.72+1.3)*1);
  drawSmallBloom(bx2+bs2, ground-24, t, 1.3);

  // Plant C — medium bloom, left-center
  const cx2 = Math.floor(cw * 0.32);
  stem(cx2, ground, 26, t, 1.0, 0.78, 2.5);
  leaf(cx2, ground-9,  -1, 'md', t, 0.78, 2.5);
  leaf(cx2, ground-16,  1, 'md', t, 0.78, 3.2);
  leaf(cx2, ground-22, -1, 'sm', t, 0.78, 3.9);
  const cs2 = Math.round(Math.sin(t*0.78+2.5)*1);
  drawMediumBloom(cx2+cs2, ground-29, t, 2.5);

  // Plant D — full bloom, center, tallest
  const dx2 = Math.floor(cw * 0.52);
  stem(dx2, ground, 34, t, 1.3, 0.8, 2.2);
  leaf(dx2, ground-10, -1, 'md', t, 0.8, 2.2);
  leaf(dx2, ground-18,  1, 'md', t, 0.8, 2.9);
  leaf(dx2, ground-25, -1, 'md', t, 0.8, 3.6);
  leaf(dx2, ground-30,  1, 'sm', t, 0.8, 4.3);
  const ds2 = Math.round(Math.sin(t*0.8+2.2)*1);
  drawFullBloom(dx2+ds2, ground-37, t, 2.2);

  // Plant E — small bloom, right-center, shorter
  const ex = Math.floor(cw * 0.65);
  stem(ex, ground, 20, t, 0.9, 0.75, 3.7);
  leaf(ex, ground-7,   1, 'md', t, 0.75, 3.7);
  leaf(ex, ground-14, -1, 'sm', t, 0.75, 4.4);
  const es = Math.round(Math.sin(t*0.75+3.7)*1);
  drawSmallBloom(ex+es, ground-22, t, 3.7);

  // Plant F — medium bloom, right
  const fx = Math.floor(cw * 0.78);
  stem(fx, ground, 28, t, 1.1, 0.68, 4.9);
  leaf(fx, ground-10,  1, 'md', t, 0.68, 4.9);
  leaf(fx, ground-17, -1, 'md', t, 0.68, 5.6);
  leaf(fx, ground-23,  1, 'sm', t, 0.68, 6.3);
  const fs = Math.round(Math.sin(t*0.68+4.9)*1);
  drawMediumBloom(fx+fs, ground-31, t, 4.9);

  // Plant G — bud, far right, leans right
  const gx = Math.floor(cw * 0.91);
  stem(gx, ground, 15, t, 0.9, 0.73, 5.8);
  leaf(gx, ground-5,  1, 'md', t, 0.73, 5.8);
  leaf(gx, ground-11,-1, 'sm', t, 0.73, 6.5);
  drawBud(gx + Math.round(Math.sin(t*0.73+5.8)*1), ground-16, t, 5.8);

  // ── GROUND ──
  drawGround(ground);

  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}

resize();
window.addEventListener('resize', resize);
frame();
</script>
</body>
</html>
